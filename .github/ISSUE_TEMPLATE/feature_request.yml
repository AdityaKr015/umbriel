name: Feature Request
description: Propose an addition or change that fits Umbriel's scope
title: "[FEATURE] "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        Umbriel is young, and it stays usable by staying small. Please read
        [SCOPE.md](https://github.com/noctalia-dev/umbriel/blob/main/SCOPE.md) before filling this in: it lists what
        the project takes on, what it declines, and the four questions every request is judged by.

        Short version. No new tiling layouts, no new layout paradigms, no desktop shell components, no plugin system.
        Sharpening what already exists is welcome.

        If you are not sure whether an idea fits, ask on [Discord](https://discord.noctalia.dev) first. That is
        faster than an issue and costs you nothing if the answer is no.

  - type: checkboxes
    id: scope-checklist
    attributes:
      label: Scope checklist
      description: Please confirm all of the following.
      options:
        - label: I read SCOPE.md and this request is not in the out of scope list.
          required: true
        - label: I am not requesting a new tiling layout or a new layout paradigm.
          required: true
        - label: I checked the [documentation](https://docs.noctalia.dev/umbriel/) and `examples/config.toml`, and this is not already possible with configuration, window or layer rules, keybinds, submaps, or `umbriel msg`.
          required: true
        - label: This needs the compositor. A desktop shell, an ordinary client, or a script over `umbriel msg` cannot do it.
          required: true
        - label: I have searched existing issues and pull requests for the same request.
          required: true
        - label: I understand this can be closed as out of scope, and that this is a decision about the project, not about the idea.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: |
        What can you not do today? Describe the situation you hit, not the feature you want.

        A request without a problem behind it is very likely to be closed.
      placeholder: |
        When I ..., Umbriel ..., so I end up ...
    validations:
      required: true

  - type: textarea
    id: attempts
    attributes:
      label: What you already tried
      description: |
        Which config keys, window or layer rules, keybinds, submaps, or `umbriel msg` actions did you try, and how did
        they fall short?
      placeholder: |
        Tried `layout.gap` and a window rule for ..., but ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Umbriel would change?
      options:
        - Existing layout behavior (scrolling, dwindle, master)
        - Floating, pinned, or fullscreen windows
        - Workspaces or scratchpad
        - Overview
        - Window or layer rules
        - Input (keyboard, pointer, touch, gestures, IME)
        - Output or display
        - Rendering (blur, shadows, borders, corners, animation)
        - Configuration
        - IPC or CLI
        - Wayland protocol support
        - Xwayland
        - Packaging or session integration
        - Documentation
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: |
        What should Umbriel do instead? Be concrete: name the config keys, action names, defaults, and edge cases you
        have in mind, and say what stays unchanged for everyone who does not use it.
      placeholder: |
        Add ... under `[...]`, defaulting to ...
        Existing behavior is unchanged when the key is absent.
    validations:
      required: true

  - type: textarea
    id: scope-fit
    attributes:
      label: Scope fit
      description: |
        Answer for your request:

        - Why does this belong in the compositor rather than in a shell, a client, or a script?
        - Does it extend something Umbriel already does, or does it open a new front?
        - Does it fall out of wlroots and SceneFX, or does it need new machinery or a new dependency?
        - What is the smallest version of it that solves your problem?
      placeholder: |
        Belongs in the compositor because ...
        Extends the existing ... path.
        Uses ... from wlroots, no new dependency.
        Smallest useful version: ...
    validations:
      required: true

  - type: textarea
    id: prior-art
    attributes:
      label: Prior art and references
      description: |
        Links to protocol specs, wlroots or SceneFX APIs, related issues, mockups, or how other compositors handle it.

        "Project X has this" is context, not a reason. Keep the problem above as the reason.
      placeholder: |
        https://wayland.app/protocols/...
        https://github.com/...

  - type: checkboxes
    id: participation
    attributes:
      label: Participation
      options:
        - label: I am willing to implement this myself, after the scope is agreed.
        - label: I can test an implementation in my own session.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: "Anything else worth knowing: screenshots, recordings, config sketches, or constraints."
