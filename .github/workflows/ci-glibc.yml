name: CI (glibc)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git clang

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check formatting
        shell: bash
        run: |
          mapfile -d '' files < <(find src tests \( -name '*.cpp' -o -name '*.h' \) -print0)
          clang-format --dry-run -Werror "${files[@]}"
          if grep -RInE '[[:blank:]]+$' --include='*.cpp' --include='*.h' src tests; then
            printf 'Source files contain trailing whitespace.\n' >&2
            exit 1
          fi

  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel clang git jemalloc just meson ninja pkgconf \
            cairo lcms2 libdrm libinput libxkbcommon mesa pango pixman \
            nlohmann-json tomlplusplus wayland wayland-protocols wlroots0.20

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build
        run: just build

      - name: Run unit tests
        run: just test

  lint:
    name: Lint
    needs: build-test
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel clang git jemalloc just meson ninja pkgconf \
            cairo lcms2 libdrm libinput libxkbcommon mesa pango pixman \
            nlohmann-json tomlplusplus wayland wayland-protocols wlroots0.20

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare compile database and generated sources
        run: |
          just configure
          meson compile -C build-debug umbriel unit-tests harness-clients

      - name: Run clang-tidy
        run: just lint
