name: CI (musl)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build and test with musl
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            alpine:edge \
            /bin/sh -eu -c '
              apk add --no-cache \
                bash build-base clang22 just meson pkgconf samurai \
                cairo-dev nlohmann-json pango-dev tomlplusplus-dev \
                wayland-dev wayland-protocols wlroots0.20-dev
              export CC=clang-22
              export CXX=clang++-22
              just build
              just test
            '
