name: Enforce Pull Request Template

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - ready_for_review

concurrency:
  group: enforce-pr-template-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enforce:
    if: ${{ github.repository == 'noctalia-dev/umbriel' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The app token can mutate PR metadata. Execute only trusted default-branch
      # code, never code from the pull request head.
      - name: Check out trusted enforcement code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Create enforcement app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PR_ENFORCER_APP_CLIENT_ID }}
          private-key: ${{ secrets.PR_ENFORCER_APP_PRIVATE_KEY }}


      - name: Validate pull request description
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python3 .github/workflows/scripts/enforce-pr-template.py "$GITHUB_EVENT_PATH"
