# Umbriel example config
# Copy to ~/.config/umbriel/config.toml or pass with `umbriel -c example.toml`.
# Changes apply on save. See docs/ for the full reference.
#
# [include] merges extra files into this one. Included files are parsed first,
# in list order (later files override earlier ones), then everything in this
# file overrides all of them. That is why Noctalia's dynamic theming can render
# its palette into a separate noctalia.toml and still let you override the
# generated colors here.

[include]
files = []

[general]
autostart = []
xwayland = true                # requires restart to change
show_cheatsheet = true         # show keybinds overlay on startup
focus_on_activate = false      # activation requests mark urgent without stealing focus

# [environment]
# GTK_THEME = "Adwaita:dark"
# QT_QPA_PLATFORMTHEME = "qt5ct"

[workspaces]
back_and_forth = false

# Colors ---------------------------------------------------------------------

[colors]
background = "#141419F0"
text_primary = "#E8E8EAFF"
text_muted = "#8A8A92FF"
accent_primary = "#7AA3FFFF"
accent_secondary = "#F5C96BFF"
warning = "#F5C96BFF"
error = "#FF6B6BFF"

# Appearance -----------------------------------------------------------------

[appearance]
prefer_no_csd = true
border_width = 2               # 0-100
outer_border_width = 0         # 0-100
corner_radius = 10             # 0-500
border_focused = "#7AA3FFFF"
border_unfocused = "#292933FF"
scratchpad_border_focused = "#E5C07BFF"
scratchpad_border_unfocused = "#5C4A2AFF"
outer_border_color = "#1A1A1FFF"
insert_hint_color = "#7FC8FF80"
backdrop_color = "#000000FF"
animation_ms = 250             # 1-10000

[appearance.blur]
enabled = true
optimized = true
passes = 3                     # 0-8
radius = 5                     # 0-100
noise = 0.02                   # 0.0-1.0
brightness = 0.9               # 0.0-2.0
contrast = 0.9                 # 0.0-2.0
saturation = 1.1               # 0.0-2.0

[appearance.shadow]
enabled = true
softness = 10                  # 0-200, 0 = hard edge
offset_x = 2                   # -200 to 200
offset_y = 2
color = "#0000008C"

# Overview -------------------------------------------------------------------

[overview]
zoom = 0.5                     # 0.1-0.75
background_tint = "#10101430"
workspace_background = "#00000044" # set alpha to FF for an opaque background

# Layout ---------------------------------------------------------------------

[layout]
mode = "scrolling"             # "scrolling" or "dwindle"
gap = 8                        # 0-500
width_presets = [0.333, 0.5, 0.667] # shared by scrolling and dwindle

[layout.scrolling]
default_width_fraction = 0.5   # 0.1-1.0
center_underfull_strip = true  # center the strip whenever it is narrower than the viewport

# Workspace layout overrides (see docs/outputs.md#workspace-rules)
# [[workspace]]
# name = "chat"
# layout.mode = "dwindle"
# layout.gap = 4
# layout.scrolling.center_underfull_strip = false

# Outputs (see docs/outputs.md) ---------------------------------------------

# [output."DP-1"]
# mode = "2560x1440@144"
# position = [0, 0]
# scale = 1.25
# Dynamic workspaces are the default; use a count or name list for static workspaces.
# workspaces = 5

# Input ----------------------------------------------------------------------

[input.keyboard]
layout = ""                    # "us,de" loads both; switch with keyboard-layout-next
variant = ""
options = ""                   # XKB options, e.g. "grp:alt_shift_toggle"
repeat_rate = 25               # 0-1000 Hz
repeat_delay = 600             # 0-10000 ms

[input.touchpad]
# tap = true
# natural_scroll = true

[input.mouse]
# natural_scroll = false
scroll_wheel_step = 60         # 1-1000
# Override only the listed settings for an exact, case-sensitive device name.
# Find names with `libinput list-devices`.
# [[input.device]]
# name = "Acme Precision Touchpad"
# tap = true
# natural_scroll = false

[input.cursor]
theme = ""
size = 24                      # 1-512

[input.focus]
follows_mouse = false
# Refuse hover focus when revealing the window would scroll further than this,
# measured in viewport widths (1.0 = one full screen). Omit for no limit.
# follows_mouse_max_scroll = 0.5

# Keybinds (see docs/keybinds.md) -------------------------------------------

[keybinds]
"Mod+Return" = "spawn:kitty"
"Mod+T" = "window-toggle-floating"
"Mod+P" = "window-toggle-pinned"
"Mod+Shift+Q" = "window-close"
"Mod+Shift+Space" = "window-move-to-scratchpad"
"Mod+Space" = "scratchpad-toggle"
"Mod+Ctrl+Space" = "window-restore-from-scratchpad"
"Mod+Tab" = "scratchpad-focus-next"
# Add `:DP-1` to any scratchpad action to target that output from anywhere.
# "Mod+0" = "scratchpad-toggle:DP-1"
# "Mod+Shift+0" = "window-move-to-scratchpad:DP-1"
# "Mod+Ctrl+0" = "window-restore-from-scratchpad:DP-1"
# "Mod+Alt+0" = "scratchpad-focus-next:DP-1"
"Mod" = "spawn:noctalia msg panel-toggle launcher"
"Mod+O" = "overview-toggle"
# "Mod+Space" is taken above; pick a free chord for layout switching.
# "Mod+Shift+K" = "keyboard-layout-next"

# Output, workspace, and window movement actions.
# "Mod+Comma" = "workspace-previous"
# "Mod+Period" = "workspace-next"
# "Mod+Ctrl+H" = "output-focus-left"
# "Mod+Minus" = "window-modify-width:-0.1"
# "Mod+C" = "window-center"
# "Mod+T" = "workspace-set-layout:toggle"

# Window and layer rules (see docs/rules.md) --------------------------------

# [[window_rule]]
# match.app_id = "firefox"
# match.title = "^Library$"
# default_floating = true
# focus_on_activate = true

# [[window_rule]]
# match.app_id = "pavucontrol"
# default_floating = true
# default_size = [800, 600]

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_size = [1020, 900]

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_size = [800, 600]

# Layer rules (see docs/rules.md#layer-rules) --------------------------------

[[layer_rule]]
match.namespace="^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd)$"
blur = true
blur_ignore_alpha = 0.5
