[appearance]
border_width = 9999          # out of range -> clamp to 100
corner_radius = "wide"       # wrong type
animation_ms = 0             # below min -> clamp to 1
border_focused = "notacolor" # invalid color
bordr_width = 3              # typo -> unknown key
prefer_no_csd = "yes"        # wrong type

[appearance.blur]
passes = 99                  # clamp to 8
noise = 5.0                  # clamp to 1.0
enabled = 1                  # wrong type (int, not bool)
unknown_blur_key = true

[appearance.shadow]
offset_x = -9999             # clamp to -200
colour = "#fff"              # typo of "color"

[overview]
zoom = 0.01                  # clamp to 0.1
background_tint = 42         # wrong type
zoomm = 0.5                  # typo
