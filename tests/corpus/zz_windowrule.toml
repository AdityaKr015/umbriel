[[window_rule]]
default_floating = 1              # int, not bool
opacity = 5.0                     # clamp
default_width = 9.0               # clamp, bespoke message
default_size = [0, 10]            # invalid
default_workspace = 999           # out of range
blur_optimised = true             # typo
[window_rule.match]
app_id = "kitty"
is_focussed = true                # typo
